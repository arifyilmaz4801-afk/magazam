<!DOCTYPE html> 
<html lang="tr"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1"> 
<title>Kürt PS4 Store</title> 
<style> 
*{box-sizing:border-box} 
body{ 
 margin:0; 
 padding:35px 15px 60px; 
 font-family:Arial,sans-serif; 
 color:#fff; 
 background:linear-gradient(135deg,#07070a,#11141d); 
} 
header{ 
 text-align:center; 
 margin-bottom:30px; 
} 
h1{ 
 margin:0; 
 font-size:42px; 
 font-weight:800; 
 background:linear-gradient(90deg,#0072ff,#00eaff); 
 -webkit-background-clip:text; 
 color:transparent; 
} 
.subtitle{ 
 margin-top:8px; 
 color:#888; 
} 
.input-container {
 width:min(550px,100%); 
 margin:0 auto 20px;
 display: flex;
 flex-direction: column;
 gap: 10px;
}
#ps4-ip{ 
 display:block; 
 width:100%; 
 padding:15px 20px; 
 border:1px solid #30333d; 
 border-radius:30px; 
 outline:none; 
 background:#1c1f2b; 
 color:#fff; 
 font-size:16px; 
 text-align: center;
} 
#ps4-ip:focus{ 
 border-color:#ff9500; 
 box-shadow:0 0 15px #ff950033; 
} 
#search{ 
 display:block; 
 width:100%; 
 padding:15px 20px; 
 border:1px solid #30333d; 
 border-radius:30px; 
 outline:none; 
 background:#151720; 
 color:#fff; 
 font-size:16px; 
} 
#search:focus{ 
 border-color:#00d9ff; 
 box-shadow:0 0 15px #00d9ff33; 
} 
#games{ 
 width:min(1200px,100%); 
 margin:auto; 
 display:grid; 
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); 
 gap:22px; 
} 
.card{ 
 overflow:hidden; 
 border:1px solid #292d38; 
 border-radius:15px; 
 background:#12141b; 
 box-shadow:0 8px 30px #0008; 
 transition:.2s; 
} 
.card:hover{ 
 transform:translateY(-5px); 
 border-color:#00d9ff; 
} 
.cover, .no-cover{ 
 width:100%; 
 height:300px; 
} 
.cover{ 
 display:block; 
 object-fit:cover; 
} 
.no-cover{ 
 display:grid; 
 place-items:center; 
 color:#777; 
 background:linear-gradient(135deg,#181a22,#252834); 
} 
.info{ 
 padding:16px; 
} 
.title{ 
 font-size:18px; 
 font-weight:bold; 
 line-height:1.35; 
 margin-bottom:10px; 
} 
.cusa{ 
 display:inline-block; 
 padding:5px 8px; 
 margin-bottom:15px; 
 border-radius:5px; 
 background:#242732; 
 color:#aaa; 
 font:12px monospace; 
} 
.btn{ 
 width:100%; 
 display:block; 
 padding:11px; 
 margin-top:8px; 
 border:0; 
 border-radius:8px; 
 text-align:center; 
 text-decoration:none; 
 font-weight:bold; 
 font-size:14px; 
 cursor:pointer; 
 transition:.2s; 
} 
.btn:hover{ 
 filter:brightness(1.15); 
 transform:scale(1.02); 
} 
.install{ 
 background:linear-gradient(90deg,#0072ff,#00d9ff); 
 color:#fff; 
} 
.update{ 
 background:linear-gradient(90deg,#15952d,#45d967); 
 color:#fff; 
} 
.backport{ 
 background:linear-gradient(90deg,#ff9500,#ffca28); 
 color:#111; 
} 
.dlc{ 
 background:linear-gradient(90deg,#ff2850,#ff4b35); 
 color:#fff; 
} 
.message{ 
 grid-column:1/-1; 
 padding:40px; 
 text-align:center; 
 color:#888; 
} 
.error{ 
 color:#ff5050; 
} 
footer{ 
 margin-top:40px; 
 text-align:center; 
 color:#444; 
 font-size:11px; 
} 
@media(max-width:600px){ 
 body{ 
 padding:22px 10px 50px; 
 } 
 h1{ 
 font-size:30px; 
 } 
 #games{ 
 grid-template-columns:1fr; 
 } 
 .cover, .no-cover{ 
 height:350px; 
 } 
} 
</style> 
</head> 
<body> 
 <header> 
 <h1>kürt ps4 store</h1> 
 <div class="subtitle">PS4 oyun merkezi</div> 
 </header> 

 <div class="input-container">
   <input id="ps4-ip" type="text" placeholder="PS4 Yerel IP Adresini Girin (Örn: 192.168.1.45)" autocomplete="off">
   <input id="search" type="search" placeholder="Oyun adı veya CUSA kodu ara..." autocomplete="off" > 
 </div>

 <section id="games"> 
 <div class="message">Oyunlar yükleniyor...</div> 
 </section> 
 <footer> 
 sunucu çalışıyorsa sorun yoktur </footer> 
 <script> 
 /* ===================================================== AYAR ===================================================== */ 
 const JSON_FILE = "./oyunlar/liste.json"; 
 let oyunlar = []; 

 /* ===================================================== YARDIMCI FONKSİYONLAR ===================================================== */ 
 function getEl(id) {
   return document.getElementById(id);
 }

 function escapeHTML(value){ 
 return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"'" }[char])); 
 } 

 function safeURL(value){ 
 const url = String(value ?? "").trim(); 
 if(/^https?:\/\//i.test(url)){ 
 return url; 
 } 
 return "#"; 
 } 

 /* ===================================================== GOLDHEN REMOTE PACKAGE INSTALLER ===================================================== */ 
 async function ps4Install(pkgURL, gameName){ 
 if(!pkgURL){ 
 alert( "Bu oyun için PKG bağlantısı bulunamadı." ); 
 return; 
 } 

 const currentIP = getEl("ps4-ip").value.trim();

 if( !currentIP ){ 
 alert( "Lütfen önce sayfanın üstündeki alana PS4 konsolunuzun IP adresini giriniz!" ); 
 return; 
 } 

 const api = `http://${currentIP}:12800/api/install`; 
 try{ 
 const response = await fetch( 
 api, { 
 method:"POST", 
 headers:{ 
 "Content-Type":"application/json" 
 }, 
 body:JSON.stringify({ 
 type:"direct", 
 packages:[pkgURL] 
 }) 
 } 
 ); 
 const result = await response.text(); 
 if(!response.ok){ 
 throw new Error( `HTTP ${response.status}` + (result ? ` - ${result}` : "") ); 
 } 
 alert( gameName + "\n\nİndirme isteği PS4'e gönderildi. Konsolunuzu kontrol edin." ); 
 console.log( "GoldHEN RPI:", result ); 
 }catch(error){ 
 console.error(error); 
 alert( 
 "PS4'e bağlantı kurulamadı.\n\n" + 
 "Kontrol et:\n" + 
 "• Yazdığın IP adresi (" + currentIP + ") doğru mu?\n" + 
 "• GoldHEN aktif mi?\n" + 
 "• Remote Package Installer çalışıyor mu?\n" + 
 "• PS4 ve bu siteye girdiğin cihaz (telefon/pc) AYNI ağda mı?\n" + 
 "• Siteniz HTTPS (Güvenli Bağlantı) kullanıyor mu? (HTTP olmalıdır!)\n\n" + 
 "Hata: " + error.message 
 ); 
 } 
 } 

 /* ===================================================== BUTONLAR ===================================================== */ 
 function installButton(url,name){ 
 if(!url){ 
 return ""; 
 } 
 return ` <button class="btn install" onclick='ps4Install( ${JSON.stringify(url)}, ${JSON.stringify(name)} )'> INSTALL </button> `; 
 } 

 function updateButton(url,name){ 
 if(!url){ 
 return ""; 
 } 
 return ` <button class="btn update" onclick='ps4Install( ${JSON.stringify(url)}, ${JSON.stringify(name + " UPDATE")} )'> UPDATE </button> `; 
 } 

 function normalButton(url,text,cls){ 
 if(!url){ 
 return ""; 
 } 
 return ` <a class="btn ${cls}" href="${safeURL(url)}" target="_blank" rel="noopener noreferrer"> ${text} </a> `; 
 } 

 /* ===================================================== OYUN KARTI ===================================================== */ 
 function oyunKarti(oyun){ 
 const ad = escapeHTML( oyun.ad || "İsimsiz oyun" ); 
 const cusa = escapeHTML( String(oyun.cusa || "CUSA").trim() ); 
 const resim = String(oyun.resim || "").trim(); 
 let imageHTML; 
 if( resim && /\.(jpg|jpeg|png|webp|gif)(\?.*)?\$/i.test(resim) ){ 
 imageHTML = ` <img class="cover" src="${safeURL(resim)}" alt="${ad}" loading="lazy" onerror=" this.outerHTML= '<div class=no-cover>Görsel bulunamadı</div>' " > `; 
 }else{ 
 imageHTML = ` <div class="no-cover"> Görsel bulunamadı </div> `; 
 } 
 return ` <article class="card"> ${imageHTML} <div class="info"> <div class="title"> ${ad} </div> <div class="cusa"> ${cusa} </div> ${installButton( oyun.link_install, oyun.ad || "Oyun" )} ${updateButton( oyun.link_update, oyun.ad || "Oyun" )} ${normalButton( oyun.link_backport, "BACKPORT", "backport" )} ${normalButton( oyun.link_dlc, "DLC", "dlc" )} </div> </article> `; 
 } 

 /* ===================================================== LİSTEYİ GÖSTER ===================================================== */ 
 function oyunlariGoster(liste){ 
 const box = getEl("games"); 
 if(!liste.length){ 
 box.innerHTML = ` <div class="message"> Aradığınız oyun bulunamadı. </div> `; 
 return; 
 } 
 box.innerHTML = liste.map(oyunKarti).join(""); 
 } 

 /* ===================================================== JSON YÜKLE ===================================================== */ 
 async function oyunlariYukle(){ 
 try{ 
 const response = await fetch( 
 JSON_FILE, { 
 cache:"no-store" } 
 ); 
 if(!response.ok){ 
 throw new Error( `liste.json HTTP ${response.status}` ); 
 } 
 const data = await response.json(); 
 if(!Array.isArray(data)){ 
 throw new Error( "liste.json bir JSON dizisi olmalı." ); 
 } 
 oyunlar = data; 
 oyunlariGoster(oyunlar); 
 }catch(error){ 
 console.error( "JSON yükleme hatası:", error ); 
 getEl("games").innerHTML = ` <div class="message error"> Oyun listesi yüklenemedi. <br><br> <small> ${escapeHTML(error.message)} </small> </div> `; 
 } 
 } 

 /* ===================================================== ARAMA ===================================================== */ 
 getEl("search").addEventListener( "input", function(){ 
 const query = this.value .trim() .toLocaleLowerCase("tr-TR"); 
 const sonuc = oyunlar.filter(oyun => { 
 const ad = String(oyun.ad || "") .toLocaleLowerCase("tr-TR"); 
 const cusa = String(oyun.cusa || "") .toLocaleLowerCase("tr-TR"); 
 return( ad.includes(query) || cusa.includes(query) ); 
 }); 
 oyunlariGoster(sonuc); 
 } 
 ); 

 /* ===================================================== LOCALSTORAGE (IP HAFIZAYA ALMA) ===================================================== */ 
 document.addEventListener("DOMContentLoaded", () => {
   const kayitliIP = localStorage.getItem("user_ps4_ip");
   if(kayitliIP){
     getEl("ps4-ip").value = kayitliIP;
   }
 });

 getEl("ps4-ip").addEventListener("input", function(){
   localStorage.setItem("user_ps4_ip", this.value.trim());
 });

 /* ===================================================== BAŞLAT ===================================================== */ 
 oyunlariYukle(); 
 </script> 
 </body> 
 </html>
