<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kürt PS4 Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;background:#08090d;color:#fff;
min-height:100vh;padding:35px 15px
}
header{text-align:center;margin-bottom:30px}
h1{
font-size:42px;font-weight:800;
background:linear-gradient(45deg,#0072ff,#00eaff);
-webkit-background-clip:text;color:transparent
}
.sub{color:#888;margin-top:8px}
.search{
display:block;width:min(520px,100%);margin:0 auto 30px;
padding:15px 20px;border-radius:30px;border:1px solid #30303b;
background:#15161e;color:#fff;outline:none;font-size:16px
}
.search:focus{border-color:#00d9ff;box-shadow:0 0 15px #00d9ff33}
#games{
max-width:1200px;margin:auto;
display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:22px
}
.card{
background:#12131a;border:1px solid #292b35;border-radius:15px;
overflow:hidden;transition:.25s;box-shadow:0 8px 25px #0006
}
.card:hover{transform:translateY(-5px);border-color:#00d9ff}
.cover{width:100%;height:290px;object-fit:cover;background:#20212a}
.noimg{
height:290px;display:grid;place-items:center;
background:linear-gradient(135deg,#181922,#242532);color:#777
}
.info{padding:16px;text-align:left}
.title{font-size:19px;font-weight:bold;margin-bottom:9px}
.meta{font-size:13px;color:#999;margin-bottom:15px}
.cusa{
display:inline-block;padding:4px 7px;background:#242630;
border-radius:5px;font-family:monospace
}
.btn{
display:block;text-align:center;text-decoration:none;
padding:11px;border-radius:8px;margin-top:8px;
font-weight:bold;color:#fff;transition:.2s
}
.btn:hover{filter:brightness(1.15);transform:scale(1.02)}
.install{background:linear-gradient(45deg,#0072ff,#00d9ff)}
.update{background:#269b3b}
.backport{background:#ffae00;color:#111}
.dlc{background:#ef3150}
.msg{grid-column:1/-1;text-align:center;color:#999;padding:40px}
footer{text-align:center;color:#555;font-size:11px;margin-top:40px}
</style>
</head>

<body>

<header>
<h1>kürt ps4 store</h1>
<p class="sub">PS4 oyun merkezi</p>
</header>

<input id="search" class="search"
placeholder="Oyun adı veya CUSA kodu ara..."
autocomplete="off">

<main id="games">
<div class="msg">Oyun listesi yükleniyor...</div>
</main>

<footer>Sunucu çalışıyorsa sorun yoktur.</footer>

<script>
const JSON_FILE="./oyunlar/liste.json";
let games=[];

const $=s=>document.querySelector(s);

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[c]));
}

function safeURL(v){
v=String(v??"").trim();
return /^https?:\/\//i.test(v)?v:"#";
}

/*
 * Burada sadece gerçek PKG/HTTP bağlantısı gösterilir.
 * GoldHEN Remote Package Installer endpoint'i,
 * kullanılan GoldHEN/RPI kurulumuna göre ayrıca tanımlanmalıdır.
 */
function install(url,name){

 if(!url || url==="#"){
  alert("Bu oyun için geçerli PKG bağlantısı yok.");
  return;
 }

 /*
  * Şimdilik PKG URL'sini açıyoruz.
  * GoldHEN RPI endpoint'i doğrulandığında bu bölüm:
  *
  *   fetch(RPI_ENDPOINT,{...})
  *
  * şeklinde değiştirilebilir.
  */
 window.location.href=url;
}

function button(url,text,cls,action=false,name=""){
 if(!url)return "";

 if(action)
 return `<button class="btn ${cls}"
 onclick='install(${JSON.stringify(safeURL(url))},${JSON.stringify(name)})'>
 ${text}</button>`;

 return `<a class="btn ${cls}" href="${safeURL(url)}"
 target="_blank" rel="noopener">${text}</a>`;
}

function render(list){
const box=$("#games");

if(!list.length){
box.innerHTML='<div class="msg">Oyun bulunamadı.</div>';
return;
}

box.innerHTML=list.map(g=>{

const image=g.resim
?`<img class="cover" src="${safeURL(g.resim)}"
onerror="this.outerHTML='<div class=noimg>Görsel bulunamadı</div>'">`
:`<div class="noimg">Görsel bulunamadı</div>`;

return `
<article class="card">
${image}
<div class="info">

<div class="title">${esc(g.ad||"İsimsiz oyun")}</div>

<div class="meta">
<span class="cusa">${esc(g.cusa||"CUSA")}</span>
</div>

${button(g.link_install,"INSTALL","install",true,g.ad)}
${button(g.link_update,"UPDATE","update")}
${button(g.link_backport,"BACKPORT","backport")}
${button(g.link_dlc,"DLC","dlc")}

</div>
</article>`;
}).join("");
}

async function load(){
try{
const r=await fetch(JSON_FILE,{cache:"no-store"});
if(!r.ok)throw Error("HTTP "+r.status);

const data=await r.json();

if(!Array.isArray(data))
throw Error("liste.json dizi değil.");

games=data;
render(games);

}catch(e){
$("#games").innerHTML=
`<div class="msg">Oyun listesi yüklenemedi.<br><br>${esc(e.message)}</div>`;
}
}

$("#search").addEventListener("input",e=>{
const q=e.target.value.toLowerCase().trim();

render(games.filter(g=>
String(g.ad||"").toLowerCase().includes(q)||
String(g.cusa||"").toLowerCase().includes(q)
));
});

load();
</script>

</body>
</html>
