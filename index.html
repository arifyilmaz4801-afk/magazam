<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kürt PS4 Store</title>
    <style>
        /* Genel Premium Tema Ayarları */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #07070a 0%, #111119 100%); 
            color: #ffffff; 
            text-align: center; 
            padding: 40px 20px; 
        }
        
        /* Mağaza Başlığı */
        header { margin-bottom: 40px; }
        h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            letter-spacing: 2px;
            background: linear-gradient(45deg, #0072ff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(0, 114, 255, 0.3);
        }
        p.subtitle { color: #8a8da4; font-size: 1.1rem; margin-top: 10px; }

        /* Arama Çubuğu */
        .search-container { margin-bottom: 30px; }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-box:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Oyun Paneli Izgarası (Grid) */
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        /* Kaliteli Oyun Kartları */
        .game-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover { 
            transform: translateY(-10px);
            border-color: #00f2fe;
            box-shadow: 0 12px 20px rgba(0, 242, 254, 0.2);
        }

        /* Oyun Kapak Resmi Alanı */
        .game-img {
            width: 100%;
            height: 300px;
            background-color: #222;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Oyun Detayları */
        .game-info { padding: 20px; text-align: left; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .game-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .game-meta { font-size: 0.9rem; color: #a0a5c1; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .tag-cusa { background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-family: monospace; }

        /* Buton Grubu */
        .button-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }

        /* Akıllı İndirme Butonları */
        .btn-download { 
            display: block; 
            color: white; 
            padding: 10px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-install { background: linear-gradient(45deg, #0072ff, #00f2fe); box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3); }
        .btn-install:hover { background: linear-gradient(45deg, #00f2fe, #0072ff); }
        
        .btn-update { background: linear-gradient(45deg, #2ba81a, #4cd964); box-shadow: 0 4px 12px rgba(43, 168, 26, 0.3); }
        .btn-update:hover { background: linear-gradient(45deg, #4cd964, #2ba81a); }

        .btn-backport { background: linear-gradient(45deg, #ff9500, #ffcc00); color: #000; box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3); }
        .btn-backport:hover { background: linear-gradient(45deg, #ffcc00, #ff9500); }

        .btn-dlc { background: linear-gradient(45deg, #ff2d55, #ff3b30); box-shadow: 0 4px 12px rgba(255, 45, 85, 0.3); }
        .btn-dlc:hover { background: linear-gradient(45deg, #ff3b30, #ff2d55); }
    </style>
</head>
<body>

    <header>
        <h1>🎮 KÜRT PS4 STORE 🎮</h1>
        <p class="subtitle">PS4 Konsolunuz İçin Doğrudan ve Hızlı FPKG Oyun İndirme Merkezi</p>
    </header>

    <!-- Gelişmiş Arama Çubuğu (Bonus) -->
    <div class="search-container">
        <input type="text" id="arama-kutusu" class="search-box" placeholder="Oyun adı veya CUSA kodu ara..." onkeyup="oyunAra()">
    </div>

    <div class="container" id="oyun-kutusu">
        <!-- Oyunlar liste.json'dan otomatik çekilecek -->
    </div>

    <script>
        let tumOyunlar = [];

        // liste.json dosyasını okuyan akıllı script
        fetch('oyunlar/liste.json')
            .then(response => response.json())
            .then(data => {
                tumOyunlar = data;
                ekranaBas(tumOyunlar);
            })
            .catch(err => console.error("Oyun listesi yüklenemedi:", err));

        // Oyunları ekrana dinamik basan fonksiyon
        function ekranaBas(oyunListesi) {
            const kutu = document.getElementById('oyun-kutusu');
            kutu.innerHTML = ""; // Önce temizle

            oyunListesi.forEach(oyun => {
                // Hangi butonların çıkacağını linklerin varlığına göre belirle
                let butonlarHTML = "";
                
                if(oyun.link_install) {
                    butonlarHTML += `<a href="${oyun.link_install}" class="btn-download btn-install" target="_blank">💿 Ana Oyunu İndir</a>`;
                }
                if(oyun.link_update) {
                    butonlarHTML += `<a href="${oyun.link_update}" class="btn-download btn-update" target="_blank">🔄 Güncelleme (Update)</a>`;
                }
                if(oyun.link_backport) {
                    butonlarHTML += `<a href="${oyun.link_backport}" class="btn-download btn-backport" target="_blank">⚙️ Backport Yaması</a>`;
                }
                if(oyun.link_dlc) {
                    butonlarHTML += `<a href="${oyun.link_dlc}" class="btn-download btn-dlc" target="_blank">🔺 DLC / Ek Paket</a>`;
                }

                kutu.innerHTML += `
                    <div class="game-card">
                        <img src="${oyun.resim}" alt="${oyun.ad}" class="game-img">
                        <div class="game-info">
                            <div>
                                <div class="game-title">${oyun.ad}</div>
                                <div class="game-meta">
                                    <span class="tag-cusa">${oyun.cusa || 'CUSA Kodu'}</span>
                                </div>
                            </div>
                            <div class="button-group">
                                ${butonlarHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Canlı Arama Motoru Fonksiyonu
        function oyunAra() {
            const aranan = document.getElementById('arama-kutusu').value.toLowerCase();
            const filtrelenmiş = tumOyunlar.filter(oyun => {
                const isimEslesti = oyun.ad.toLowerCase().includes(aranan);
                const cusaEslesti = oyun.cusa ? oyun.cusa.toLowerCase().includes(aranan) : false;
                return isimEslesti || cusaEslesti;
            });
            ekranaBas(filtrelenmiş);
        }
    </script>
</body>
</html>
