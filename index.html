<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kürt PS4 Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #07070a 0%, #111119 100%); 
            color: #ffffff; 
            text-align: center; 
            padding: 40px 20px; 
        }
        header { margin-bottom: 40px; }
        h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            background: linear-gradient(45deg, #0072ff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(0, 114, 255, 0.3);
        }
        p.subtitle { color: #8a8da4; font-size: 1.1rem; margin-top: 10px; }
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }
        .game-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .game-card:hover { 
            transform: translateY(-10px);
            border-color: #00f2fe;
            box-shadow: 0 12px 20px rgba(0, 242, 254, 0.2);
        }
        .game-img { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .game-info { padding: 20px; text-align: left; }
        .game-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .game-meta { font-size: 0.9rem; color: #a0a5c1; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .tag-pkg { background: #0072ff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .btn-download { 
            display: block; 
            background: linear-gradient(45deg, #0072ff, #00f2fe); 
            color: white; 
            padding: 12px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 KÜRT PS4 STORE 🎮</h1>
        <p class="subtitle">PS4 Konsolunuz İçin Doğrudan ve Hızlı PKG Oyun İndirme Merkezi</p>
    </header>

    <div class="container" id="oyun-kutusu">
        <!-- Oyunlar buraya otomatik yüklenecek -->
    </div>

    <script>
        // Klasördeki oyun listesini çeken akıllı kod
        fetch('oyunlar/liste.json')
            .then(response => response.json())
            .then(data => {
                const kutu = document.getElementById('oyun-kutusu');
                data.forEach(oyun => {
                    kutu.innerHTML += `
                        <div class="game-card">
                            <img src="${oyun.resim}" alt="${oyun.ad}" class="game-img">
                            <div class="game-info">
                                <div class="game-title">${oyun.ad}</div>
                                <div class="game-meta">
                                    <span>Boyut: ${oyun.boyut}</span>
                                    <span class="tag-pkg">PKG</span>
                                </div>
                                <a href="${oyun.link}" class="btn-download" target="_blank">Oyunu İndir</a>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => console.error("Oyunlar yüklenirken hata oluştu:", err));
    </script>
</body>
</html>
