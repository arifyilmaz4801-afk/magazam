<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kürt PS4 Store</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:30px 15px 60px;
 font-family:Arial,sans-serif;
 color:#fff;
 background:linear-gradient(135deg,#07070a,#11131c);
}
header{text-align:center;margin-bottom:30px}
h1{
 margin:0;
 font-size:42px;
 background:linear-gradient(90deg,#0072ff,#00eaff);
 -webkit-background-clip:text;
 color:transparent;
}
.subtitle{color:#888;margin-top:8px}

#search{
 display:block;
 width:min(550px,100%);
 margin:0 auto 30px;
 padding:15px 20px;
 border-radius:30px;
 border:1px solid #30333d;
 outline:0;
 background:#151720;
 color:#fff;
 font-size:16px;
}
#search:focus{border-color:#00d9ff}

#games{
 width:min(1200px,100%);
 margin:auto;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:22px;
}

.card{
 overflow:hidden;
 border:1px solid #292d38;
 border-radius:15px;
 background:#12141b;
 box-shadow:0 8px 30px #0008;
 transition:.2s;
}
.card:hover{
 transform:translateY(-5px);
 border-color:#00d9ff;
}

.cover,.no-cover{
 width:100%;
 height:300px;
}
.cover{display:block;object-fit:cover}
.no-cover{
 display:grid;
 place-items:center;
 color:#777;
 background:linear-gradient(135deg,#181a22,#252834);
}

.info{padding:16px}
.title{
 font-size:18px;
 font-weight:bold;
 line-height:1.35;
 margin-bottom:10px;
}
.cusa{
 display:inline-block;
 padding:5px 8px;
 border-radius:5px;
 background:#242732;
 color:#aaa;
 font:12px monospace;
 margin-bottom:15px;
}

.btn{
 width:100%;
 display:block;
 border:0;
 padding:11px;
 margin-top:8px;
 border-radius:8px;
 text-align:center;
 text-decoration:none;
 font-weight:bold;
 cursor:pointer;
 transition:.2s;
}
.btn:hover{filter:brightness(1.15)}
.install{background:linear-gradient(90deg,#0072ff,#00d9ff);color:#fff}
.update{background:linear-gradient(90deg,#15952d,#45d967);color:#fff}
.backport{background:linear-gradient(90deg,#ff9500,#ffca28);color:#111}
.dlc{background:linear-gradient(90deg,#ff2850,#ff4b35);color:#fff}

.message{
 grid-column:1/-1;
 text-align:center;
 color:#888;
 padding:40px;
}

footer{
 margin-top:40px;
 text-align:center;
 color:#444;
 font-size:11px;
}

@media(max-width:600px){
 body{padding:22px 10px 50px}
 h1{font-size:30px}
 #games{grid-template-columns:1fr}
 .cover,.no-cover{height:350px}
}
</style>
</head>

<body>

<header>
 <h1>kürt ps4 store</h1>
 <div class="subtitle">PS4 oyun merkezi</div>
</header>

<input
 id="search"
 type="search"
 placeholder="Oyun adı veya CUSA kodu ara..."
 autocomplete="off"
>

<section id="games">
 <div class="message">Oyunlar yükleniyor...</div>
</section>

<footer>sunucu çalışıyorsa sorun yoktur</footer>

<script>
const JSON_FILE="./oyunlar/liste.json";
let oyunlar=[];

const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[c]));
}

function url(v){
 v=String(v??"").trim();
 return /^https?:\/\//i.test(v)?v:"#";
}

function buton(link,text,cls){
 if(!link)return "";
 return `
 <a class="btn ${cls}"
    href="${url(link)}"
    target="_blank"
    rel="noopener noreferrer">
    ${text}
 </a>`;
}

function kart(oyun){

 const ad=esc(oyun.ad||"İsimsiz oyun");
 const cusa=esc((oyun.cusa||"CUSA").trim());

 /*
  * rawg.io tek başına resim dosyası olmadığı için
  * gerçek resim URL'si değilse görsel göstermiyoruz.
  */
 const resim=String(oyun.resim||"").trim();

 const image=
  resim &&
  /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(resim)
  ?
  `<img class="cover"
        src="${url(resim)}"
        alt="${ad}"
        loading="lazy"
        onerror="this.outerHTML='<div class=no-cover>Görsel bulunamadı</div>'">`
  :
  `<div class="no-cover">Görsel bulunamadı</div>`;

 return `
 <article class="card">

  ${image}

  <div class="info">

   <div class="title">${ad}</div>

   <div class="cusa">${cusa}</div>

   ${buton(oyun.link_install,"INSTALL","install")}
   ${buton(oyun.link_update,"UPDATE","update")}
   ${buton(oyun.link_backport,"BACKPORT","backport")}
   ${buton(oyun.link_dlc,"DLC","dlc")}

  </div>

 </article>`;
}

function goster(liste){

 const box=$("games");

 if(!liste.length){
  box.innerHTML=
   `<div class="message">Aradığınız oyun bulunamadı.</div>`;
  return;
 }

 box.innerHTML=liste.map(kart).join("");
}

async function yukle(){

 try{

  const response=await fetch(JSON_FILE,{
   cache:"no-store"
  });

  if(!response.ok)
   throw new Error("liste.json HTTP "+response.status);

  const data=await response.json();

  if(!Array.isArray(data))
   throw new Error("liste.json bir JSON dizisi olmalı.");

  oyunlar=data;
  goster(oyunlar);

 }catch(error){

  console.error(error);

  $("games").innerHTML=`
   <div class="message">
    Oyun listesi yüklenemedi.
    <br><br>
    <small>${esc(error.message)}</small>
   </div>`;
 }
}

$("search").addEventListener("input",function(){

 const q=this.value
  .trim()
  .toLocaleLowerCase("tr-TR");

 const sonuc=oyunlar.filter(oyun=>{

  const ad=String(oyun.ad||"")
   .toLocaleLowerCase("tr-TR");

  const cusa=String(oyun.cusa||"")
   .toLocaleLowerCase("tr-TR");

  return ad.includes(q)||cusa.includes(q);
 });

 goster(sonuc);
});

yukle();
</script>

</body>
</html>
