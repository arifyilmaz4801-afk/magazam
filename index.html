<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kürt PS4 Store</title>
    <style>
        /* Modern ve Premium Tema Ayarları */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f0f14 0%, #151522 100%); 
            color: #ffffff; 
            text-align: center; 
            padding: 40px 20px; 
        }
        
        /* Mağaza Başlığı */
        header { margin-bottom: 40px; }
        h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            letter-spacing: 2px;
            background: linear-gradient(45deg, #0072ff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(0, 114, 255, 0.3);
        }
        p.subtitle { color: #8a8da4; font-size: 1.1rem; margin-top: 10px; }

        /* Oyun Paneli Izgarası (Grid) */
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        /* Kaliteli Oyun Kartları */
        .game-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        /* Kartın üzerine gelince parlama efekti */
        .game-card:hover { 
            transform: translateY(-10px);
            border-color: #00f2fe;
            box-shadow: 0 12px 20px rgba(0, 242, 254, 0.2);
        }

        /* Oyun Kapak Resmi Alanı */
        .game-img {
            width: 100%;
            height: 280px;
            background-color: #222;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Oyun Detayları */
        .game-info { padding: 20px; text-align: left; }
        .game-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .game-meta { font-size: 0.9rem; color: #a0a5c1; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .tag-pkg { background: #0072ff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }

        /* Premium İndirme Butonu */
        .btn-download { 
            display: block; 
            background: linear-gradient(45deg, #0072ff, #00f2fe); 
            color: white; 
            padding: 12px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover { 
            background: linear-gradient(45deg, #00f2fe, #0072ff);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 KÜRT PS4 STORE 🎮</h1>
        <p class="subtitle">oyun indirme merkezi falan filan</p>
    </header>

    <div class="container">
        <!-- 1. OYUN KARTI -->
        <div class="game-card">
            <!-- Görsel linkini gerçek bir oyun kapak resmiyle değiştirebilirsin -->
            <img src="https://placeholder.com" alt="Oyun Kapağı" class="game-img">
            <div class="game-info">
                <div class="game-title">Grand Theft Auto V</div>
                <div class="game-meta">
                    <span>Boyut: 45 GB</span>
                    <span class="tag-pkg">PKG</span>
                </div>
                <a href="BURAYA_GTA5_LINKINI_YAZ" class="btn-download" target="_blank">Oyunu İndir</a>
            </div>
        </div>

        <!-- 2. OYUN KARTI -->
        <div class="game-card">
            <img src="https://placeholder.com" alt="Oyun Kapağı" class="game-img">
            <div class="game-info">
                <div class="game-title">God of War</div>
                <div class="game-meta">
                    <span>Boyut: 38 GB</span>
                    <span class="tag-pkg">PKG</span>
                </div>
                <a href="BURAYA_GOW_LINKINI_YAZ" class="btn-download" target="_blank">Oyunu İndir</a>
            </div>
        </div>

        <!-- 3. OYUN KARTI -->
        <div class="game-card">
            <img src="https://placeholder.com" alt="Oyun Kapağı" class="game-img">
            <div class="game-info">
                <div class="game-title">FIFA 24 (FC 24)</div>
                <div class="game-meta">
                    <span>Boyut: 42 GB</span>
                    <span class="tag-pkg">PKG</span>
                </div>
                <a href="BURAYA_FIFA_LINKINI_YAZ" class="btn-download" target="_blank">Oyunu İndir</a>
            </div>
        </div>
    </div>

</body>
</html>
